<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>TRIUNVIRATO · Control</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; --army: #4ade80; --army-soft: #14532d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1220; color: #f8fafc; padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); }
    main { width: min(100%, 520px); margin: 0 auto; }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: .02em; }
    h2 { margin: 18px 0 8px; font-size: 1.08rem; }
    h3 { margin: 0; font-size: 1rem; }
    p { color: #cbd5e1; }
    .intro { margin: 3px 0 14px; color: #94a3b8; font-size: .88rem; }
    #connection, #result { padding: 10px 12px; border-radius: 12px; background: #1e293b; margin: 10px 0; font-size: .9rem; }
    #connection[data-state="connected"] { background: #14532d; }
    #connection[data-state="disconnected"] { background: #7f1d1d; }
    #result { min-height: 2.6em; border: 1px solid #334155; }
    #result[data-kind="success"] { border-color: #22c55e; color: #bbf7d0; }
    #result[data-kind="error"] { border-color: #ef4444; color: #fecaca; }
    section { margin-top: 16px; }
    button { width: 100%; min-height: 50px; padding: 11px 13px; border: 0; border-radius: 13px; color: #07111f; font: inherit; font-weight: 750; line-height: 1.3; touch-action: manipulation; }
    button:disabled { opacity: .46; }
    button:focus-visible { outline: 3px solid white; outline-offset: 2px; }
    .green { background: #4ade80; }
    .red { background: #f87171; }
    .blue { background: #60a5fa; }
    .pink { background: #ff69b4; }
    .purple { background: #c084fc; }
    .neutral { background: #cbd5e1; }
    .secondary { min-height: 44px; color: #f8fafc; background: #334155; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .tabs button { min-height: 44px; padding: 7px; opacity: .68; }
    .tabs button.active { opacity: 1; outline: 2px solid white; outline-offset: 1px; }
    .seat, .upgrade, .hero-summary { padding: 13px; border: 1px solid #263449; border-radius: 15px; background: #121c2c; margin: 9px 0; }
    .seat { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .seat-name { font-weight: 750; }
    .seat-state, .muted { color: #94a3b8; font-size: .88rem; text-align: right; }
    .army-header { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-left: 4px solid var(--army); padding: 5px 0 5px 11px; }
    .army-header h2 { margin: 0; font-size: 1.2rem; }
    .wave-label { color: #94a3b8; font-size: .82rem; white-space: nowrap; }
    .section-tabs { position: sticky; top: 0; z-index: 2; margin: 12px 0; padding: 5px; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 5px; border-radius: 14px; background: #0b1220; }
    .section-tabs button { min-height: 42px; padding: 7px 4px; color: #cbd5e1; background: #1e293b; font-size: .88rem; }
    .section-tabs button.active { color: #07111f; background: var(--army); }
    .hero-summary { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
    .hero-stat { min-width: 0; padding: 8px; border-radius: 10px; background: #0b1220; overflow-wrap: anywhere; }
    .hero-stat strong { display: block; font-size: .98rem; }
    .hero-stat span { display: block; color: #94a3b8; font-size: .74rem; }
    .stat-section { padding: 12px; border: 1px solid #263449; border-radius: 15px; background: #121c2c; margin: 9px 0; }
    .stat-section h3 { margin-bottom: 8px; }
    .stat-note { margin: 8px 0 0; color: #94a3b8; font-size: .78rem; }
    .upgrade { display: grid; gap: 7px; }
    .upgrade-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .level { flex: 0 0 auto; padding: 4px 7px; border-radius: 20px; background: #263449; color: #e2e8f0; font-size: .77rem; font-weight: 750; }
    .status-pill { justify-self: start; padding: 3px 8px; border-radius: 20px; background: #263449; color: #cbd5e1; font-size: .74rem; font-weight: 750; }
    .status-pill[data-state="available"] { background: #14532d; color: #bbf7d0; }
    .status-pill[data-state="insufficient"], .status-pill[data-state="waiting"] { background: #713f12; color: #fef3c7; }
    .status-pill[data-state="locked"] { background: #7f1d1d; color: #fecaca; }
    .status-pill[data-state="max"] { background: #334155; color: #e2e8f0; }
    .description, .effect, .blocked { margin: 0; font-size: .85rem; line-height: 1.4; }
    .description { color: #aebdd0; }
    .effect { color: #e2e8f0; }
    .effect strong { color: var(--army); }
    .blocked { color: #fbbf24; }
    .upgrade button { min-height: 46px; background: var(--army); }
    .upgrade button[data-status="max"] { color: #d1d5db; background: #334155; }
    .tower-artifact { border: 1px dashed #475569; }
    .tower-damage { margin: 4px 0; font-size: 1.25rem; font-weight: 800; }
    .upgrade-card { padding: 14px; border: 2px solid #475569; border-radius: 15px; margin: 10px 0; background: #121c2c; }
    .upgrade-card[data-category="progression"] { border-color: #c084fc; }
    .upgrade-card[data-category="towers"] { border-color: #f87171; }
    .upgrade-card[data-category="hero"] { border-color: #60a5fa; }
    .upgrade-card[data-category="specialabilities"] { border-color: #ff69b4; }
    .target-button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .special-card { border-color: var(--army); }
    .special-card button { color: #07111f; background: var(--army); }
    .upgrade-timer { font-size: 1.15rem; font-weight: 800; }
    .damage-summary-wrap { max-width: 100%; overflow-x: auto; margin: 12px 0 18px; }
    .damage-summary { width: 100%; min-width: 520px; border-collapse: collapse; font-size: .92rem; }
    .damage-summary th, .damage-summary td { padding: 10px 6px; border-bottom: 1px solid #334155; text-align: right; }
    .damage-summary th:first-child, .damage-summary td:first-child { text-align: left; }
    .final-screen { border: 1px solid #475569; border-radius: 16px; padding: 16px; background: #121c2c; }
    .final-screen h2 { margin-top: 0; }
    .final-votes { font-weight: 800; color: #cbd5e1; }
    .lobby-actions { display: grid; gap: 2px; }
    .player-name-field { display: grid; gap: 6px; margin: 14px 0 8px; color: #cbd5e1; font-size: .92rem; font-weight: 650; }
    .player-name-field input { width: 100%; min-height: 46px; border: 1px solid #40516a; border-radius: 8px; padding: 9px 11px; background: #101a29; color: #f8fafc; font: inherit; }
    [hidden] { display: none !important; }
    @media (max-width: 360px) { body { padding-left: 10px; padding-right: 10px; } .section-tabs button { font-size: .8rem; } }
  </style>
</head>
<body>
  <main>
    <h1>TRIUNVIRATO</h1>
    <p class="intro">Control cooperativo de la partida</p>
    <div id="connection" data-state="disconnected" role="status">Desconectado de Unity</div>
    <div id="result" role="status" aria-live="polite">Conectando con la partida…</div>

    <section id="lobby">
      <h2>Sala de espera</h2>
      <p id="lobby-message">Conéctate para elegir un ejército.</p>
      <div id="seats" aria-label="Estado de las plazas"></div>
      <label class="player-name-field" for="player-name">Tu nombre (opcional, máximo 24 caracteres)
        <input id="player-name" type="text" maxlength="24" autocomplete="nickname" placeholder="Nombre visible durante la partida">
      </label>
      <div class="lobby-actions">
        <button class="green choose-army" data-army="tierra" disabled>Elegir Tierra</button>
        <button class="red choose-army" data-army="aire" disabled>Elegir Aire</button>
        <button class="blue choose-army" data-army="mar" disabled>Elegir Mar</button>
        <button id="developer" class="neutral" disabled>Entrar en modo desarrollador</button>
      </div>
      <button id="reconnectLobby" class="secondary">Conectar / volver a conectar</button>
    </section>

    <section id="control" hidden>
      <div class="army-header"><h2 id="panel-heading">Ejército</h2><span class="wave-label" id="wave-label"></span></div>
      <div id="dev-tabs" class="tabs" hidden>
        <button class="green" data-tab="tierra">Tierra</button>
        <button class="red" data-tab="aire">Aire</button>
        <button class="blue" data-tab="mar">Agua</button>
      </div>
      <nav id="section-tabs" class="section-tabs" aria-label="Secciones del ejército">
        <button data-view="statistics" class="active" aria-pressed="true">Estadísticas</button>
        <button data-view="attacks" aria-pressed="false">Ataques</button>
      </nav>
      <div id="section-content"></div>
      <button id="reconnect" class="secondary">Conectar / volver a conectar</button>
    </section>
  </main>

  <script>
    (() => {
      const connection = document.getElementById('connection');
      const result = document.getElementById('result');
      const lobby = document.getElementById('lobby');
      const control = document.getElementById('control');
      const lobbyMessage = document.getElementById('lobby-message');
      const seatsElement = document.getElementById('seats');
      const content = document.getElementById('section-content');
      const sectionTabs = document.getElementById('section-tabs');
      const developerButton = document.getElementById('developer');
      const playerNameInput = document.getElementById('player-name');
      const chooseButtons = [...document.querySelectorAll('.choose-army')];
      const tabs = [...document.querySelectorAll('[data-tab]')];
      const sectionButtons = [...document.querySelectorAll('[data-view]')];
      const names = { tierra: 'Tierra', aire: 'Aire', mar: 'Mar' };
      const colors = { tierra: 'green', aire: 'red', mar: 'blue' };
      const icons = { tierra: '🟢', aire: '🔴', mar: '🔵' };
      const legacyAbilityIcons = { tierra: '🧟', aire: '☄️', mar: '⚡' };
      const numberFormat = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });
      const specialAbilityDefinitions = {
        aire: [
          { id: 'fire_rage', icon: '🌋', name: 'fireRageAbilityName', fallbackName: 'Furia ígnea', description: 'fireRageAbilityDescription', remaining: 'fireRageCooldownRemaining', duration: 'fireRageCooldownDuration', canActivate: 'fireRageCanActivate', detail: a => `Daño adicional: +${numberFormat.format(a.fireRageDamageBonusPercent || 0)} % · Duración: ${numberFormat.format(a.fireRageDuration || 0)} s` },
          { id: 'hero_clone', icon: '👥', name: 'cloneAbilityName', fallbackName: 'Clon', description: 'cloneAbilityDescription', remaining: 'cloneCooldownRemaining', duration: 'cloneCooldownDuration', canActivate: 'cloneCanActivate', detail: a => `Duración: ${numberFormat.format(a.cloneDuration || 0)} s` }
        ],
        tierra: [
          { id: 'knight_summon', icon: '⚔️', name: 'knightSummonAbilityName', fallbackName: 'Invocar caballero', description: 'knightSummonAbilityDescription', remaining: 'knightSummonCooldownRemaining', duration: 'knightSummonCooldownDuration', canActivate: 'knightSummonCanActivate', detail: () => 'Invoca un caballero aliado que combate automáticamente.' }
        ],
        mar: [
          { id: 'water_tornado', icon: '🌪️', name: 'waterTornadoAbilityName', fallbackName: 'Huracán imparable', description: 'waterTornadoAbilityDescription', remaining: 'waterTornadoCooldownRemaining', duration: 'waterTornadoCooldownDuration', canActivate: 'waterTornadoCanActivate', detail: a => `Daño: ${numberFormat.format(a.waterTornadoDamage || 0)} · Empuje hacia la izquierda: ${numberFormat.format(Math.abs(a.waterTornadoPushDistance || 0))}` },
          { id: 'electric_bird', icon: '🦅', name: 'electricBirdAbilityName', fallbackName: 'Ave eléctrica', description: 'electricBirdAbilityDescription', remaining: 'electricBirdCooldownRemaining', duration: 'electricBirdCooldownDuration', canActivate: 'electricBirdCanActivate', detail: a => `Ralentiza y duplica el daño recibido durante ${numberFormat.format(a.electricBirdDuration || 0)} s.` }
        ]
      };
      const tokenKey = 'triunvirato-session-token';
      let token = localStorage.getItem(tokenKey);
      if (!token) {
        token = crypto.randomUUID ? crypto.randomUUID() :
          Array.from(crypto.getRandomValues(new Uint8Array(24)), n => n.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(tokenKey, token);
      }
      let socket, state;
      let connected = false, sessionReady = false, developerMode = false;
      let selectedPanel = '', activeView = 'statistics', stateRevision = -1, requestCounter = 0;
      let previousMatchStatus = null;
      const previousArmyLevels = Object.create(null);
      const pendingRequests = new Map();
      const pendingActions = new Set();

      function vibrateFor(eventName) {
        const durations = { start: 80, end: [80, 45, 140], level: 45 };
        if (!Object.prototype.hasOwnProperty.call(durations, eventName)) return;
        try {
          if (navigator.vibrate) navigator.vibrate(durations[eventName]);
        } catch (_) { /* Unsupported devices and browser restrictions are harmless. */ }
      }

      function handleHaptics(nextState) {
        const controlledArmies = nextState.developerMode
          ? (nextState.armies || [])
          : (nextState.armies || []).filter(item => item.army === nextState.selectedArmy);
        const controlsPlayerArmy = !!nextState.developerMode || !!nextState.selectedArmy;
        if (controlsPlayerArmy && previousMatchStatus === 'WaitingForPlayers' && nextState.status === 'InProgress') vibrateFor('start');
        if (controlsPlayerArmy && previousMatchStatus === 'InProgress' && nextState.status === 'Finished') vibrateFor('end');
        let leveledUp = false;
        for (const army of controlledArmies) {
          if (previousArmyLevels[army.army] !== undefined && army.level > previousArmyLevels[army.army]) leveledUp = true;
          previousArmyLevels[army.army] = army.level;
        }
        if (leveledUp) vibrateFor('level');
        previousMatchStatus = nextState.status;
      }

      function armyIcon(army) { return icons[army] || ''; }
      function armyLabel(army) { return names[army] || army; }
      function attackRate(cooldown) { return cooldown > 0 ? `${numberFormat.format(1 / cooldown)} / s` : '0 / s'; }

      function request(message, actionKey = '') {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        if (actionKey && pendingActions.has(actionKey)) return;
        const requestId = `${Date.now()}-${++requestCounter}`;
        message.requestId = requestId;
        if (actionKey) { pendingActions.add(actionKey); pendingRequests.set(requestId, actionKey); renderPanel(); }
        socket.send(JSON.stringify(message));
      }
      function feedback(text, success) {
        result.textContent = text || (success ? 'Mejora seleccionada.' : 'No se pudo seleccionar la mejora.');
        result.dataset.kind = success ? 'success' : 'error';
      }
      function updateConnection(isConnected) {
        connected = isConnected;
        connection.dataset.state = isConnected ? 'connected' : 'disconnected';
        connection.textContent = isConnected ? 'Conectado a Unity' : 'Desconectado de Unity';
        if (!isConnected) { sessionReady = false; pendingRequests.clear(); pendingActions.clear(); render(); }
      }
      function renderSeats() {
        if (!state || !Array.isArray(state.seats)) return;
        seatsElement.replaceChildren(...state.seats.map(seat => {
          const row = document.createElement('div'); row.className = 'seat';
          const name = document.createElement('span'); name.className = 'seat-name';
          name.textContent = `${armyIcon(seat.army)} ${armyLabel(seat.army)}`;
          const status = document.createElement('span'); status.className = 'seat-state';
          status.textContent = seat.selectedByMe ? 'Tu plaza' : seat.status === 'occupied' ?
            (seat.connected ? 'Ocupada' : 'Reservada') : 'Libre';
          row.append(name, status); return row;
        }));
        chooseButtons.forEach(button => {
          const seat = state.seats.find(item => item.army === button.dataset.army);
          const mine = seat && seat.selectedByMe, free = seat && seat.status === 'free';
          button.disabled = !connected || !sessionReady || state.status !== 'WaitingForPlayers' || developerMode || (!free && !mine);
          button.textContent = mine ? `Seleccionado · ${names[button.dataset.army]}` : `Elegir ${names[button.dataset.army]}`;
        });
        developerButton.disabled = !connected || !sessionReady || state.status !== 'WaitingForPlayers' || !state.developerAvailable || developerMode;
      }
      function statSection(title, entries, note = '') {
        const section = document.createElement('article'); section.className = 'stat-section';
        const heading = document.createElement('h3'); heading.textContent = title; section.append(heading);
        const grid = document.createElement('div'); grid.className = 'hero-summary';
        for (const [value, label] of entries) {
          const item = document.createElement('div'); item.className = 'hero-stat';
          const strong = document.createElement('strong'); strong.textContent = value;
          const caption = document.createElement('span'); caption.textContent = label;
          item.append(strong, caption); grid.append(item);
        }
        section.append(grid);
        if (note) { const explanation = document.createElement('p'); explanation.className = 'stat-note'; explanation.textContent = note; section.append(explanation); }
        return section;
      }
      function createCombatStatistics(army) {
        const fragments = document.createDocumentFragment();
        fragments.append(statSection('Progreso', [
          [`Nivel ${army.level}`, 'Nivel actual'],
          [`${numberFormat.format(army.experience)} / ${numberFormat.format(army.experienceNeeded)} XP`, 'Experiencia'],
          [`×${numberFormat.format(army.experienceMultiplier)}`, 'Multiplicador de EXP'],
          [`${numberFormat.format(army.luckChance * 100)} %`, 'Suerte · mejoras de dos estrellas']
        ]));
        const heroStats = [
          [`${numberFormat.format(army.heroDamage)}`, 'Daño por ataque'],
          [attackRate(army.heroAttackCooldown), 'Ataques por segundo'],
          [`${numberFormat.format(army.heroRange)} u`, 'Alcance']
        ];
        if (army.army === 'aire') heroStats.push([`${numberFormat.format(army.heroSplashRadius)} u`, 'Radio de ataque de área']);
        if (army.army === 'mar') heroStats.push([`+${numberFormat.format(army.heroBossDamageBonusPercent)} %`, 'Daño contra jefes']);
        fragments.append(statSection(`Héroe · ${army.heroName || armyLabel(army.army)}`, heroStats));
        if (army.towerUnlocked) fragments.append(statSection(`Torre · ${army.towerName}`, [
          [`${numberFormat.format(army.currentDamage)}`, 'Daño por ataque'],
          [attackRate(army.towerAttackCooldown), 'Ataques por segundo'],
          [`${numberFormat.format(army.towerRange)} u`, 'Alcance']
        ]));
        return fragments;
      }

      function renderFinalScreen() {
        document.getElementById('panel-heading').textContent = 'Partida terminada';
        document.getElementById('wave-label').textContent = '';
        document.getElementById('dev-tabs').hidden = true;
        sectionTabs.hidden = true;
        const screen = document.createElement('section'); screen.className = 'final-screen';
        const title = document.createElement('h2'); title.textContent = 'Resumen de la partida';
        const note = document.createElement('p'); note.className = 'muted';
        note.textContent = 'Daño que redujo la vida de los enemigos; el exceso sobre su vida restante no se cuenta.';
        const table = document.createElement('table'); table.className = 'damage-summary';
        table.innerHTML = '<thead><tr><th>Ejército</th><th>Héroe</th><th>Clon</th><th>Torres</th><th>Habilidades</th><th>Total</th></tr></thead>';
        const tableWrap = document.createElement('div'); tableWrap.className = 'damage-summary-wrap'; tableWrap.tabIndex = 0;
        tableWrap.setAttribute('aria-label', 'Resumen de daño; desplázate horizontalmente para ver todas las columnas');
        const body = document.createElement('tbody');
        for (const army of state.armies || []) {
          const values = [army.damageByHero || 0, army.damageByClone || 0, army.damageByTower || 0, army.damageBySpecialAbility || 0];
          const row = document.createElement('tr');
          const nameCell = document.createElement('th'); nameCell.scope = 'row'; nameCell.textContent = armyLabel(army.army); row.append(nameCell);
          for (const value of [...values.map(v => numberFormat.format(v)), numberFormat.format(values.reduce((a, b) => a + b, 0))]) {
            const cell = document.createElement('td'); cell.textContent = value; row.append(cell);
          }
          body.append(row);
        }
        table.append(body); tableWrap.append(table);
        const votes = document.createElement('p'); votes.className = 'final-votes';
        votes.textContent = `Reinicios confirmados: ${state.restartRequestCount || 0} / 3`;
        const ownArmy = state.armies.find(item => item.army === state.selectedArmy);
        const button = document.createElement('button'); button.className = 'green';
        const alreadyVoted = !!(ownArmy && ownArmy.restartRequested);
        button.textContent = alreadyVoted ? 'Reinicio solicitado ✓' : 'Solicitar reinicio';
        button.disabled = !connected || !sessionReady || developerMode || !ownArmy || alreadyVoted || pendingActions.has('restart');
        button.addEventListener('click', () => request({ type: 'requestRestart' }, 'restart'));
        const help = document.createElement('p'); help.className = 'muted'; help.textContent = 'La partida nueva comienza cuando confirmen los tres ejércitos.';
        screen.append(title, note, tableWrap, votes, button, help);
        content.replaceChildren(screen);
      }
      function createSpecialAbilityCard(army) {
        const card = document.createElement('article'); card.className = 'upgrade-card special-card';
        const icon = legacyAbilityIcons[army.army] || '✨';
        const title = document.createElement('h3'); title.textContent = `${icon} Habilidad especial`;
        const name = document.createElement('p'); name.className = 'description'; name.textContent = army.specialAbilityName || 'Habilidad especial';
        if (army.specialAbilityDescription) {
          const description = document.createElement('p'); description.className = 'description'; description.textContent = army.specialAbilityDescription;
          card.append(title, name, description);
        } else card.append(title, name);
        const remaining = Math.max(0, army.specialCooldownRemaining || 0);
        const cooldown = document.createElement('p'); cooldown.className = 'muted';
        cooldown.textContent = `Cooldown: ${numberFormat.format(army.specialCooldownDuration || 0)} s`;
        const detail = document.createElement('p'); detail.className = 'description';
        if (army.army === 'tierra') {
          detail.textContent = `Inmoviliza ${numberFormat.format(army.specialNormalDuration || 0)} s · Jefes: ${numberFormat.format(army.specialBossDuration || 0)} s`;
        } else if (army.army === 'aire') {
          detail.textContent = `${army.specialEffectCount || 0} meteoritos · ${numberFormat.format(army.specialDamagePerEffect || 0)} daño por meteorito`;
        } else if (army.army === 'mar') {
          detail.textContent = `${army.specialEffectCount || 0} rayos · ${numberFormat.format(army.specialDamagePerEffect || 0)} daño por rayo`;
        }
        card.append(detail, cooldown);
        const status = document.createElement('p'); status.className = 'muted';
        if (developerMode && remaining > 0) status.textContent = `Modo desarrollador · ignora el cooldown (${Math.ceil(remaining)} s restantes)`;
        else if (remaining > 0) status.textContent = `Disponible en ${numberFormat.format(remaining)} s`;
        else if (army.specialCanActivate) status.textContent = 'Lista para activar';
        else status.textContent = 'No hay enemigos vivos en el mapa';

        const actionKey = `special:${selectedPanel}:legacy`;
        const pending = pendingActions.has(actionKey);
        const button = document.createElement('button');
        button.textContent = remaining > 0 && !developerMode ? `${icon} ${army.specialAbilityName} · ${Math.ceil(remaining)} s` : `${icon} ${army.specialAbilityName}`;
        button.disabled = pending || !connected || !army.canControl || (!army.specialCanActivate && !developerMode);
        button.addEventListener('click', () => request({ type: 'activateSpecial', army: selectedPanel }, actionKey));
        card.append(status, button);
        return card;
      }
      function createConfiguredAbilityCard(army, ability) {
        const card = document.createElement('article'); card.className = 'upgrade-card special-card';
        const title = document.createElement('h3'); title.textContent = `${ability.icon} ${ability.name || 'Habilidad'}`;
        const desc = document.createElement('p'); desc.className = 'description'; desc.textContent = ability.description || '';
        const values = document.createElement('p'); values.className = 'description'; values.textContent = ability.detail;
        const remaining = Math.max(0, ability.cooldownRemaining || 0);
        const cooldown = document.createElement('p'); cooldown.className = 'muted';
        cooldown.textContent = `Cooldown: ${numberFormat.format(ability.cooldownDuration || 0)} s`;
        const status = document.createElement('p'); status.className = 'muted';
        status.textContent = developerMode && remaining > 0 ? `Modo desarrollador · ignora el cooldown (${Math.ceil(remaining)} s restantes)` :
          remaining > 0 ? `Disponible en ${numberFormat.format(remaining)} s` : developerMode || ability.canActivate ? 'Lista para activar' : 'No disponible durante esta partida';
        const actionKey = `special:${selectedPanel}:${ability.id}`;
        const button = document.createElement('button');
        button.textContent = remaining > 0 && !developerMode ? `${ability.icon} ${ability.name} · ${Math.ceil(remaining)} s` : `${ability.icon} ${ability.name}`;
        button.disabled = pendingActions.has(actionKey) || !connected || !army.canControl || (!ability.canActivate && !developerMode);
        button.addEventListener('click', () => request({ type: 'activateSpecial', army: selectedPanel, abilityId: ability.id }, actionKey));
        card.append(title, desc, values, cooldown, status, button);
        return card;
      }

      function abilityCard(army, definition) {
        return {
          id: definition.id,
          icon: definition.icon,
          name: army[definition.name] || definition.fallbackName,
          description: army[definition.description] || '',
          cooldownRemaining: army[definition.remaining] || 0,
          cooldownDuration: army[definition.duration] || 0,
          detail: definition.detail(army),
          canActivate: !!army[definition.canActivate]
        };
      }
      function createWarBlessingCard(army) {
        const card = document.createElement('article'); card.className = 'upgrade-card special-card';
        const title = document.createElement('h3'); title.textContent = `⚡ ${army.warBlessingAbilityName || 'Acelerar aliado'}`;
        const desc = document.createElement('p'); desc.className = 'description'; desc.textContent = army.warBlessingAbilityDescription || '';
        const detail = document.createElement('p'); detail.className = 'description';
        detail.textContent = `Velocidad de ataque: +${numberFormat.format(army.warBlessingBonusPercent || 0)} % · Duración: ${numberFormat.format(army.warBlessingDuration || 0)} s`;
        const remaining = Math.max(0, army.warBlessingCooldownRemaining || 0);
        const cooldown = document.createElement('p'); cooldown.className = 'muted';
        cooldown.textContent = `Cooldown compartido: ${numberFormat.format(army.warBlessingCooldownDuration || 0)} s`;
        const status = document.createElement('p'); status.className = 'muted';
        status.textContent = developerMode && remaining > 0 ? `Modo desarrollador · ignora el cooldown (${Math.ceil(remaining)} s restantes)` :
          remaining > 0 ? `Disponible en ${numberFormat.format(remaining)} s` : 'Selecciona el héroe aliado';
        const row = document.createElement('div'); row.className = 'target-button-row';
        const actionKey = `special:${selectedPanel}:war_blessing`;
        const pending = pendingActions.has(actionKey);
        for (const target of [
          { armyId: 'aire', label: 'Aire', color: 'red', can: army.warBlessingCanActivateAire },
          { armyId: 'mar', label: 'Agua', color: 'blue', can: army.warBlessingCanActivateMar }
        ]) {
          const button = document.createElement('button'); button.className = target.color;
          button.textContent = remaining > 0 && !developerMode ? `${target.label} · ${Math.ceil(remaining)} s` : target.label;
          button.disabled = pending || !connected || !army.canControl || (!target.can && !developerMode);
          button.addEventListener('click', () => request({ type: 'activateSpecial', army: selectedPanel,
            abilityId: 'war_blessing', targetArmy: target.armyId }, actionKey));
          row.append(button);
        }
        card.append(title, desc, detail, cooldown, status, row);
        return card;
      }
      function createAttacksPanel(army) {
        const panel = document.createDocumentFragment();
        panel.append(createSpecialAbilityCard(army));
        for (const definition of specialAbilityDefinitions[army.army] || [])
          panel.append(createConfiguredAbilityCard(army, abilityCard(army, definition)));
        if (army.army === 'tierra') {
          panel.append(createWarBlessingCard(army));
        }
        return panel;
      }
      function renderPanel() {
        if (!state || (!sessionReady && state.status !== 'Finished')) return;
        const inMatch = state.status === 'InProgress' || state.status === 'Finished';
        if (!inMatch) {
          control.hidden = true; lobby.hidden = false;
          lobbyMessage.textContent = state.status === 'WaitingForPlayers'
            ? 'Elige una plaza libre. La partida empieza al ocupar Tierra, Aire y Agua.' : 'Esperando a Unity…';
          return;
        }
        lobby.hidden = true; control.hidden = false;
        if (state.status === 'Finished') { renderFinalScreen(); return; }
        if (!developerMode && !state.selectedArmy) {
          document.getElementById('panel-heading').textContent = 'Partida en curso';
          document.getElementById('dev-tabs').hidden = true;
          sectionTabs.hidden = true;
          content.replaceChildren(); return;
        }
        if (!selectedPanel || (!developerMode && selectedPanel !== state.selectedArmy)) selectedPanel = developerMode ? 'tierra' : state.selectedArmy;
        const army = state.armies.find(item => item.army === selectedPanel); if (!army) return;
        document.documentElement.style.setProperty('--army', selectedPanel === 'tierra' ? '#4ade80' : selectedPanel === 'aire' ? '#f87171' : '#60a5fa');
        document.documentElement.style.setProperty('--army-soft', selectedPanel === 'tierra' ? '#123322' : selectedPanel === 'aire' ? '#3b171b' : '#172d49');
        document.getElementById('panel-heading').textContent = developerMode ? `Desarrollador · ${names[selectedPanel]}` : `${army.playerName || names[selectedPanel]} · Nivel ${army.level}`;
        document.getElementById('wave-label').textContent = `Oleada ${state.currentWave || 0}`;
        document.getElementById('dev-tabs').hidden = !developerMode;
        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === selectedPanel));
        const xpSummary = document.createElement('p'); xpSummary.className = 'muted';
        xpSummary.textContent = `${army.playerName || names[selectedPanel]} · Nivel ${army.level} · ${numberFormat.format(army.experience)} / ${numberFormat.format(army.experienceNeeded)} XP · Multiplicador ×${numberFormat.format(army.experienceMultiplier)} · Suerte ${numberFormat.format(army.luckChance * 100)} % · Aumento de EXP +${numberFormat.format(army.experienceIncrease * 100)} %`;
        content.replaceChildren(xpSummary);

        if (army.hasUpgradeOffer) {
          sectionTabs.hidden = true;
          content.replaceChildren(xpSummary);
          const title = document.createElement('h2'); title.textContent = army.hasBossOffer ? 'Recompensa de jefe · elige una mejora' : `¡Nivel ${army.level}! · elige una mejora`;
          content.append(title);
          for (const option of (army.upgradeOptions || [])) {
            if (!option) continue;
            const card = document.createElement('article'); card.className = 'upgrade-card'; card.dataset.category = option.category;
            const heading = document.createElement('h3'); heading.textContent = `${option.category === 'progression' ? '✨ Progresión' : option.category === 'towers' ? '🔴 Torres' : option.category === 'specialabilities' ? '🩷 Habilidad especial' : '🔵 Héroe'} · ${option.name}`;
            const desc = document.createElement('p'); desc.className = 'description'; desc.textContent = option.description;
            const button = document.createElement('button'); button.className = option.category === 'progression' ? 'purple' : option.category === 'towers' ? 'red' : option.category === 'specialabilities' ? 'pink' : 'blue';
            button.textContent = 'Elegir mejora';
            const actionKey = `upgrade:${selectedPanel}`; const pending = pendingActions.has(actionKey);
            button.disabled = pending || !connected || !army.canControl;
            button.addEventListener('click', () => request({ type: 'selectUpgrade', army: selectedPanel, choice: option.id, offerToken: option.offerToken }, actionKey));
            const rarity = document.createElement('p'); rarity.className = 'muted';
            rarity.style.fontSize = '1.2rem'; rarity.style.letterSpacing = '.18em';
            rarity.textContent = '⭐'.repeat(Math.max(1, Math.min(3, option.stars || 1)));
            card.append(heading, desc, button, rarity);
            content.append(card);
          }
          return;
        }
        sectionTabs.hidden = false;
        sectionButtons.forEach(button => {
          const isActive = button.dataset.view === activeView;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });

        const fragment = activeView === 'attacks'
          ? createAttacksPanel(army)
          : createCombatStatistics(army);
        if (state.status === 'Finished') {
          const finished = document.createElement('p'); finished.className = 'blocked'; finished.textContent = 'Partida finalizada. Las órdenes están bloqueadas.'; fragment.prepend(finished);
        }
        content.replaceChildren(fragment);
      }
      function render() { if (!state) return; renderSeats(); renderPanel(); }
      function connect() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
        result.textContent = 'Conectando…'; result.dataset.kind = '';
        socket = new WebSocket(`ws://${location.host}/ws`);
        socket.addEventListener('open', () => { stateRevision = -1; updateConnection(true); request({ type: 'hello', clientToken: token }); });
        socket.addEventListener('close', () => {
          updateConnection(false);
          pendingRequests.clear(); pendingActions.clear();
          renderPanel();
        });
        socket.addEventListener('error', () => { updateConnection(false); feedback('No se pudo conectar. Comprueba la Wi-Fi y vuelve a intentarlo.', false); });
        socket.addEventListener('message', event => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'matchState') {
              if (message.revision < stateRevision) return;
              handleHaptics(message);
              stateRevision = message.revision; state = message;
              if (sessionReady && message.selectedArmy) {
                const ownArmy = (message.armies || []).find(item => item.army === message.selectedArmy);
                if (ownArmy && !playerNameInput.dataset.edited) playerNameInput.value = ownArmy.playerName || '';
              }
              if (sessionReady && !selectedPanel) selectedPanel = message.developerMode ? 'tierra' : message.selectedArmy;
              developerMode = message.developerMode; render();
            } else if (message.type === 'sessionResult') {
              sessionReady = message.success;
              if (message.message) { result.textContent = message.message; result.dataset.kind = message.success ? 'success' : 'error'; }
              render();
            } else {
              const actionKey = pendingRequests.get(message.requestId);
              if (actionKey) { pendingRequests.delete(message.requestId); pendingActions.delete(actionKey); }
              feedback(message.message, !!message.success);
              renderPanel();
            }
          } catch (_) { feedback('Unity envió una respuesta no válida.', false); }
        });
      }
      playerNameInput.addEventListener('input', () => { playerNameInput.dataset.edited = 'true'; });
      chooseButtons.forEach(button => button.addEventListener('click', () => request({ type: 'selectArmy', army: button.dataset.army, playerName: playerNameInput.value.trim().slice(0, 24) })));
      developerButton.addEventListener('click', () => request({ type: 'joinDeveloper', playerName: playerNameInput.value.trim().slice(0, 24) }));
      tabs.forEach(tab => tab.addEventListener('click', () => { if (developerMode) { selectedPanel = tab.dataset.tab; renderPanel(); } }));
      sectionButtons.forEach(button => button.addEventListener('click', () => { activeView = button.dataset.view; renderPanel(); }));
      document.getElementById('reconnect').addEventListener('click', connect);
      document.getElementById('reconnectLobby').addEventListener('click', connect);
      connect();
    })();
  </script>
</body>
</html>
