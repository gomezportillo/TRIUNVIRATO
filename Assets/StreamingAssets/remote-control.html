<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>TRIUNVIRATO · Control</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; --army: #4ade80; --army-soft: #14532d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1220; color: #f8fafc; padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); }
    main { width: min(100%, 520px); margin: 0 auto; }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: .02em; }
    h2 { margin: 18px 0 8px; font-size: 1.08rem; }
    h3 { margin: 0; font-size: 1rem; }
    p { color: #cbd5e1; }
    .intro { margin: 3px 0 14px; color: #94a3b8; font-size: .88rem; }
    #connection, #result { padding: 10px 12px; border-radius: 12px; background: #1e293b; margin: 10px 0; font-size: .9rem; }
    #connection[data-state="connected"] { background: #14532d; }
    #connection[data-state="disconnected"] { background: #7f1d1d; }
    #result { min-height: 2.6em; border: 1px solid #334155; }
    #result[data-kind="success"] { border-color: #22c55e; color: #bbf7d0; }
    #result[data-kind="error"] { border-color: #ef4444; color: #fecaca; }
    section { margin-top: 16px; }
    button { width: 100%; min-height: 50px; padding: 11px 13px; border: 0; border-radius: 13px; color: #07111f; font: inherit; font-weight: 750; line-height: 1.3; touch-action: manipulation; }
    button:disabled { opacity: .46; }
    button:focus-visible { outline: 3px solid white; outline-offset: 2px; }
    .green { background: #4ade80; }
    .red { background: #f87171; }
    .blue { background: #60a5fa; }
    .neutral { background: #cbd5e1; }
    .secondary { min-height: 44px; color: #f8fafc; background: #334155; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .tabs button { min-height: 44px; padding: 7px; opacity: .68; }
    .tabs button.active { opacity: 1; outline: 2px solid white; outline-offset: 1px; }
    .seat, .upgrade, .hero-summary, .wallet { padding: 13px; border: 1px solid #263449; border-radius: 15px; background: #121c2c; margin: 9px 0; }
    .seat { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .seat-name { font-weight: 750; }
    .seat-state, .muted { color: #94a3b8; font-size: .88rem; text-align: right; }
    .army-header { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-left: 4px solid var(--army); padding: 5px 0 5px 11px; }
    .army-header h2 { margin: 0; font-size: 1.2rem; }
    .wave-label { color: #94a3b8; font-size: .82rem; white-space: nowrap; }
    .wallet { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--army-soft); border-color: color-mix(in srgb, var(--army) 36%, #263449); }
    .wallet-value { font-size: 1.35rem; font-weight: 800; }
    .wallet-income { color: #d1fae5; font-size: .82rem; text-align: right; }
    .section-tabs { position: sticky; top: 0; z-index: 2; margin: 12px 0; padding: 5px; display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; border-radius: 14px; background: #0b1220; }
    .section-tabs button { min-height: 42px; padding: 7px 4px; color: #cbd5e1; background: #1e293b; font-size: .88rem; }
    .section-tabs button.active { color: #07111f; background: var(--army); }
    .hero-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; text-align: center; }
    .hero-stat { min-width: 0; }
    .hero-stat strong { display: block; font-size: 1rem; }
    .hero-stat span { display: block; color: #94a3b8; font-size: .73rem; }
    .upgrade { display: grid; gap: 7px; }
    .upgrade-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .level { flex: 0 0 auto; padding: 4px 7px; border-radius: 20px; background: #263449; color: #e2e8f0; font-size: .77rem; font-weight: 750; }
    .status-pill { justify-self: start; padding: 3px 8px; border-radius: 20px; background: #263449; color: #cbd5e1; font-size: .74rem; font-weight: 750; }
    .status-pill[data-state="available"] { background: #14532d; color: #bbf7d0; }
    .status-pill[data-state="insufficient"], .status-pill[data-state="waiting"] { background: #713f12; color: #fef3c7; }
    .status-pill[data-state="locked"] { background: #7f1d1d; color: #fecaca; }
    .status-pill[data-state="max"] { background: #334155; color: #e2e8f0; }
    .description, .effect, .costline, .blocked { margin: 0; font-size: .85rem; line-height: 1.4; }
    .description { color: #aebdd0; }
    .effect { color: #e2e8f0; }
    .effect strong { color: var(--army); }
    .costline { font-weight: 750; }
    .blocked { color: #fbbf24; }
    .upgrade button { min-height: 46px; background: var(--army); }
    .upgrade button[data-status="max"] { color: #d1d5db; background: #334155; }
    .tower-artifact { border: 1px dashed #475569; }
    .tower-damage { margin: 4px 0; font-size: 1.25rem; font-weight: 800; }
    .purchase-card { padding: 14px; border: 2px solid #475569; border-radius: 15px; margin: 10px 0; background: #121c2c; }
    .purchase-card[data-category="economy"] { border-color: #4ade80; }
    .purchase-card[data-category="towers"] { border-color: #f87171; }
    .purchase-card[data-category="hero"] { border-color: #60a5fa; }
    .purchase-timer { font-size: 1.15rem; font-weight: 800; }
    .lobby-actions { display: grid; gap: 2px; }
    [hidden] { display: none !important; }
    @media (max-width: 360px) { body { padding-left: 10px; padding-right: 10px; } .section-tabs button { font-size: .8rem; } .wallet-value { font-size: 1.2rem; } }
  </style>
</head>
<body>
  <main>
    <h1>TRIUNVIRATO</h1>
    <p class="intro">Control cooperativo de la partida</p>
    <div id="connection" data-state="disconnected" role="status">Desconectado de Unity</div>
    <div id="result" role="status" aria-live="polite">Conectando con la partida…</div>

    <section id="lobby">
      <h2>Sala de espera</h2>
      <p id="lobby-message">Conéctate para elegir un ejército.</p>
      <div id="seats" aria-label="Estado de las plazas"></div>
      <div class="lobby-actions">
        <button class="green choose-army" data-army="tierra" disabled>Elegir Tierra</button>
        <button class="red choose-army" data-army="aire" disabled>Elegir Aire</button>
        <button class="blue choose-army" data-army="mar" disabled>Elegir Mar</button>
        <button id="developer" class="neutral" disabled>Entrar en modo desarrollador</button>
      </div>
      <button id="reconnectLobby" class="secondary">Conectar / volver a conectar</button>
    </section>

    <section id="control" hidden>
      <div class="army-header"><h2 id="panel-heading">Ejército</h2><span class="wave-label" id="wave-label"></span></div>
      <div id="dev-tabs" class="tabs" hidden>
        <button class="green" data-tab="tierra">Tierra</button>
        <button class="red" data-tab="aire">Aire</button>
        <button class="blue" data-tab="mar">Agua</button>
      </div>
      <div id="wallet" class="wallet"></div>
      <nav id="section-tabs" class="section-tabs" aria-label="Secciones de mejoras">
        <button data-section="hero" class="active">🦸 Héroe</button>
        <button data-section="tower">🗼 Torre</button>
        <button data-section="resources">📦 Recursos</button>
      </nav>
      <div id="section-content"></div>
      <button id="reconnect" class="secondary">Conectar / volver a conectar</button>
    </section>
  </main>

  <script>
    (() => {
      const connection = document.getElementById('connection');
      const result = document.getElementById('result');
      const lobby = document.getElementById('lobby');
      const control = document.getElementById('control');
      const lobbyMessage = document.getElementById('lobby-message');
      const seatsElement = document.getElementById('seats');
      const wallet = document.getElementById('wallet');
      const content = document.getElementById('section-content');
      const developerButton = document.getElementById('developer');
      const chooseButtons = [...document.querySelectorAll('.choose-army')];
      const tabs = [...document.querySelectorAll('[data-tab]')];
      const sectionButtons = [...document.querySelectorAll('[data-section]')];
      const names = { tierra: 'Tierra', aire: 'Aire', mar: 'Agua' };
      const colors = { tierra: 'green', aire: 'red', mar: 'blue' };
      const icons = { tierra: '🟢', aire: '🔴', mar: '🔵' };
      const numberFormat = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });
      const tokenKey = 'triunvirato-session-token';
      let token = localStorage.getItem(tokenKey);
      if (!token) {
        token = crypto.randomUUID ? crypto.randomUUID() :
          Array.from(crypto.getRandomValues(new Uint8Array(24)), n => n.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(tokenKey, token);
      }
      let socket, state;
      let connected = false, sessionReady = false, developerMode = false;
      let selectedPanel = '', activeSection = 'hero', stateRevision = -1, requestCounter = 0;
      const pendingRequests = new Map();
      const pendingActions = new Set();

      function request(message, actionKey = '') {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        if (actionKey && pendingActions.has(actionKey)) return;
        const requestId = `${Date.now()}-${++requestCounter}`;
        message.requestId = requestId;
        if (actionKey) { pendingActions.add(actionKey); pendingRequests.set(requestId, actionKey); renderPanel(); }
        socket.send(JSON.stringify(message));
      }
      function feedback(text, success) {
        result.textContent = text || (success ? 'Compra realizada.' : 'No se pudo completar la compra.');
        result.dataset.kind = success ? 'success' : 'error';
      }
      function updateConnection(isConnected) {
        connected = isConnected;
        connection.dataset.state = isConnected ? 'connected' : 'disconnected';
        connection.textContent = isConnected ? 'Conectado a Unity' : 'Desconectado de Unity';
        if (!isConnected) { sessionReady = false; pendingRequests.clear(); pendingActions.clear(); render(); }
      }
      function renderSeats() {
        if (!state || !Array.isArray(state.seats)) return;
        seatsElement.replaceChildren(...state.seats.map(seat => {
          const row = document.createElement('div'); row.className = 'seat';
          const name = document.createElement('span'); name.className = 'seat-name';
          name.textContent = `${names[seat.army] || seat.army} ${icons[seat.army] || ''}`;
          const status = document.createElement('span'); status.className = 'seat-state';
          status.textContent = seat.selectedByMe ? 'Tu plaza' : seat.status === 'occupied' ?
            (seat.connected ? 'Ocupada' : 'Reservada') : 'Libre';
          row.append(name, status); return row;
        }));
        chooseButtons.forEach(button => {
          const seat = state.seats.find(item => item.army === button.dataset.army);
          const mine = seat && seat.selectedByMe, free = seat && seat.status === 'free';
          button.disabled = !connected || !sessionReady || state.status !== 'WaitingForPlayers' || developerMode || (!free && !mine);
          button.textContent = mine ? `Seleccionado · ${names[button.dataset.army]}` : `Elegir ${names[button.dataset.army]}`;
        });
        developerButton.disabled = !connected || !sessionReady || state.status !== 'WaitingForPlayers' || !state.developerAvailable || developerMode;
      }
      function makeUpgradeCard(army, option) {
        const card = document.createElement('article'); card.className = 'upgrade';
        const top = document.createElement('div'); top.className = 'upgrade-top';
        const title = document.createElement('h3'); title.textContent = option.name;
        const level = document.createElement('span'); level.className = 'level';
        level.textContent = `Nv. ${option.level}/${option.maximumLevel}`; top.append(title, level);
        const status = document.createElement('span'); status.className = 'status-pill'; status.dataset.state = option.status || '';
        status.textContent = option.status === 'max' ? 'Nivel máximo' : option.status === 'locked' ? 'Bloqueada' :
          option.status === 'waiting' ? 'En espera' : option.status === 'insufficient' ? 'Faltan recursos' :
          option.level > 0 ? 'Comprada · disponible' : 'Disponible';
        const description = document.createElement('p'); description.className = 'description'; description.textContent = option.description || '';
        const current = document.createElement('p'); current.className = 'effect'; current.innerHTML = `Actual: <strong>${escapeHtml(option.currentEffect || '—')}</strong>`;
        const next = document.createElement('p'); next.className = 'effect'; next.innerHTML = `Siguiente: <strong>${escapeHtml(option.nextEffect || '—')}</strong>`;
        const cost = document.createElement('p'); cost.className = 'costline';
        cost.textContent = option.level >= option.maximumLevel ? 'Coste: —' : `Coste: ${option.nextCost} ${icons[army]}` +
          (option.secondaryCost > 0 ? ` + ${option.secondaryCost} ${icons[option.secondaryArmy] || '🪙'}` : '');
        const button = document.createElement('button'); button.className = colors[army];
        const actionKey = `upgrade:${army}:${option.id}`;
        const pending = pendingActions.has(actionKey);
        button.dataset.status = option.status || '';
        button.textContent = pending ? 'Procesando…' : option.level >= option.maximumLevel ? 'Nivel máximo' :
          option.status === 'locked' ? 'No disponible' : `Mejorar · ${option.nextCost} ${icons[army]}` +
          (option.secondaryCost > 0 ? ` + ${option.secondaryCost} ${icons[option.secondaryArmy] || '🪙'}` : '');
        const armyState = state.armies.find(item => item.army === army);
        button.disabled = pending || !connected || !sessionReady || !armyState.canControl || !option.canPurchase;
        button.addEventListener('click', () => request({ type: 'buyUpgrade', army, upgrade: option.id }, actionKey));
        card.append(top, status, description, current, next, cost, button);
        if (option.blockedReason && option.status !== 'max') {
          const blocked = document.createElement('p'); blocked.className = 'blocked'; blocked.textContent = option.blockedReason; card.append(blocked);
        }
        return card;
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      }
      function createHeroSummary(army) {
        const summary = document.createElement('div'); summary.className = 'hero-summary';
        const stats = [
          [numberFormat.format(army.heroDamage), 'Daño / golpe'],
          [`${numberFormat.format(army.heroRange)} m`, 'Alcance'],
          [`${numberFormat.format(1 / Math.max(.01, army.heroAttackCooldown))}/s`, 'Ataques']
        ];
        if (army.heroSplashRadius > 0) stats.push([`${numberFormat.format(army.heroSplashRadius)} m`, 'Área']);
        for (const [value, label] of stats) {
          const item = document.createElement('div'); item.className = 'hero-stat';
          const strong = document.createElement('strong'); strong.textContent = value;
          const caption = document.createElement('span'); caption.textContent = label;
          item.append(strong, caption); summary.append(item);
        }
        return summary;
      }
      function createTowerCard(army, data) {
        const card = document.createElement('article'); card.className = 'upgrade tower-artifact';
        const title = document.createElement('h3'); title.textContent = data.owned ? 'Torre desbloqueada' : 'Desbloquear torre';
        const level = document.createElement('span'); level.className = 'level';
        level.textContent = data.owned ? `Nv. ${data.upgradeLevel}/${data.towerMaximumLevel}` : 'Bloqueada';
        const top = document.createElement('div'); top.className = 'upgrade-top'; top.append(title, level);
        const damage = document.createElement('div'); damage.className = 'tower-damage';
        damage.textContent = `${numberFormat.format(data.currentDamage)} daño`;
        const nextEffect = document.createElement('p'); nextEffect.className = 'effect';
        nextEffect.textContent = data.owned && data.canUpgrade
          ? `Siguiente nivel: ${numberFormat.format(data.nextDamage)} daño (+${numberFormat.format(data.upgradeDamagePercent)}%)`
          : !data.owned ? `Daño al desbloquear: ${numberFormat.format(data.nextDamage)}` : 'Daño al máximo';
        const desc = document.createElement('p'); desc.className = 'description';
        desc.textContent = data.owned ? `La torre permanece en el mapa y mejora su daño ${numberFormat.format(data.upgradeDamagePercent)}% por nivel.` : 'Desbloquea la torre de tu ejército en su posición de la partida.';
        const cost = document.createElement('p'); cost.className = 'costline';
        const maxed = data.owned && !data.canUpgrade;
        cost.textContent = maxed ? 'Mejora al nivel máximo' : `Siguiente coste: ${data.nextCost} ${icons[army]}`;
        const button = document.createElement('button'); button.className = colors[army];
        const actionKey = `tower:${army}`;
        const pending = pendingActions.has(actionKey);
        button.textContent = pending ? 'Procesando…' : maxed ? 'Nivel máximo' : data.owned ? 'Mejorar torre' : 'Desbloquear torre';
        button.disabled = pending || !connected || !sessionReady || !data.canControl || !data.canPurchaseTower || maxed;
        button.addEventListener('click', () => request({ type: 'buyTower', army }, actionKey));
        card.append(top, damage, nextEffect, desc, cost, button);
        if (!data.canPurchaseTower && !maxed) {
          const blocked = document.createElement('p'); blocked.className = 'blocked';
          blocked.textContent = state.status !== 'InProgress' ? 'Disponible cuando empiece la partida.' : `Necesitas ${data.nextCost} ${icons[army]}.`;
          card.append(blocked);
        }
        return card;
      }
      function createCombatStatistics(army) {
        const stats = document.createElement('article'); stats.className = 'hero-summary';
        const values = [
          [`${numberFormat.format(army.heroDamage)} / golpe`, 'Daño del héroe'],
          [`${numberFormat.format(army.currentDamage)} / golpe`, 'Daño de torre'],
          [`${numberFormat.format(1 / Math.max(.01, army.towerAttackCooldown))}/s`, 'Ataques de torre'],
          [`${numberFormat.format(army.towerRange)} m`, 'Alcance de torre'],
          [`${numberFormat.format(army.passiveIncomePerSecond)} ${icons[army.army]}/s`, 'Ingreso pasivo']
        ];
        for (const [value, label] of values) {
          const item = document.createElement('div'); item.className = 'hero-stat';
          const strong = document.createElement('strong'); strong.textContent = value;
          const caption = document.createElement('span'); caption.textContent = label;
          item.append(strong, caption); stats.append(item);
        }
        return stats;
      }
      function renderPanel() {
        if (!state || !sessionReady) return;
        const inMatch = state.status === 'InProgress' || state.status === 'Finished';
        if (!inMatch) {
          control.hidden = true; lobby.hidden = false;
          lobbyMessage.textContent = state.status === 'WaitingForPlayers'
            ? 'Elige una plaza libre. La partida empieza al ocupar Tierra, Aire y Agua.' : 'Esperando a Unity…';
          return;
        }
        lobby.hidden = true; control.hidden = false;
        if (!developerMode && !state.selectedArmy) {
          document.getElementById('panel-heading').textContent = 'Partida en curso';
          document.getElementById('dev-tabs').hidden = true;
          wallet.textContent = 'Esta sesión no tiene un ejército asignado.'; content.replaceChildren(); return;
        }
        if (!selectedPanel || (!developerMode && selectedPanel !== state.selectedArmy)) selectedPanel = developerMode ? 'tierra' : state.selectedArmy;
        const army = state.armies.find(item => item.army === selectedPanel); if (!army) return;
        document.documentElement.style.setProperty('--army', selectedPanel === 'tierra' ? '#4ade80' : selectedPanel === 'aire' ? '#f87171' : '#60a5fa');
        document.documentElement.style.setProperty('--army-soft', selectedPanel === 'tierra' ? '#123322' : selectedPanel === 'aire' ? '#3b171b' : '#172d49');
        document.getElementById('panel-heading').textContent = developerMode ? `Desarrollador · ${names[selectedPanel]}` : `Ejército ${names[selectedPanel]}`;
        document.getElementById('wave-label').textContent = `Oleada ${state.currentWave || 0}`;
        document.getElementById('dev-tabs').hidden = !developerMode;
        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === selectedPanel));
        sectionButtons.forEach(button => { button.hidden = true; });
        wallet.replaceChildren();
        const balance = document.createElement('span'); balance.className = 'wallet-value'; balance.textContent = `${icons[selectedPanel]} ${army.coins}`;
        const income = document.createElement('span'); income.className = 'wallet-income';
        income.textContent = state.purchasePhase
          ? `⏸ Pausado · ${numberFormat.format(army.passiveIncomePerSecond)} ${icons[selectedPanel]}/s en combate`
          : army.incomeSummary || `${numberFormat.format(army.passiveIncomePerSecond)} ${icons[selectedPanel]}/s`;
        wallet.append(balance, income);

        if (state.purchasePhase) {
          sectionButtons.forEach(button => button.hidden = true);
          const summary = createHeroSummary(army);
          content.replaceChildren(summary);
          const title = document.createElement('h2'); title.textContent = `Preparad la siguiente oleada · ${Math.ceil(state.purchaseSecondsRemaining)} s`;
          content.append(title);
          if (army.purchaseChoiceMade) {
            const wait = document.createElement('p'); wait.className = 'muted'; wait.textContent = `Elección realizada: ${army.purchaseResult}. Esperando a los demás…`; content.append(wait);
          }
          for (const option of (state.purchaseOptions || [])) {
            const card = document.createElement('article'); card.className = 'purchase-card'; card.dataset.category = option.category;
            const currencies = ['tierra', 'aire', 'mar'];
            const requirements = (option.resourceCosts || []).map((amount, index) => {
              const resourceArmy = state.armies.find(item => item.army === currencies[index]);
              return { amount, army: currencies[index], balance: resourceArmy ? resourceArmy.coins : 0 };
            }).filter(cost => cost.amount > 0);
            const affordable = requirements.every(cost => cost.balance >= cost.amount);
            const costLabel = requirements.map(cost => `${cost.amount} ${icons[cost.army]}`).join(' + ');
            const balanceLabel = requirements.map(cost => `${cost.balance} ${icons[cost.army]}`).join(' + ');
            const heading = document.createElement('h3'); heading.textContent = `${option.category === 'economy' ? '🟢 Economía' : option.category === 'towers' ? '🔴 Torres' : '🔵 Héroe'} · ${option.name}`;
            const desc = document.createElement('p'); desc.className = 'description'; desc.textContent = option.description;
            const cost = document.createElement('p'); cost.className = 'costline'; cost.textContent = `Precio: ${costLabel} · Disponible: ${balanceLabel}`;
            const button = document.createElement('button'); button.className = option.category === 'economy' ? 'green' : option.category === 'towers' ? 'red' : 'blue';
            button.textContent = `Comprar · ${costLabel}`;
            const actionKey = `intermission:${selectedPanel}`; const pending = pendingActions.has(actionKey);
            button.disabled = pending || army.purchaseChoiceMade || !connected || !army.canControl || !affordable;
            button.addEventListener('click', () => request({ type: 'buyIntermissionUpgrade', army: selectedPanel, choice: option.id }, actionKey));
            card.append(heading, desc, cost, button);
            if (!affordable && !army.purchaseChoiceMade) { const reason = document.createElement('p'); reason.className = 'blocked'; reason.textContent = `Saldo insuficiente para ${costLabel}.`; card.append(reason); }
            content.append(card);
          }
          const resources = document.createElement('article'); resources.className = 'purchase-card';
          const resourceTitle = document.createElement('h3'); resourceTitle.textContent = '📦 Guardar para después';
          const resourceDesc = document.createElement('p'); resourceDesc.className = 'description'; resourceDesc.textContent = `Recibe ${state.resourceChoiceReward} ${icons[selectedPanel]} ahora.`;
          const resourceButton = document.createElement('button'); resourceButton.className = 'neutral'; resourceButton.textContent = `Conseguir ${state.resourceChoiceReward} recursos`;
          const resourceKey = `intermission:${selectedPanel}`; const resourcePending = pendingActions.has(resourceKey);
          resourceButton.disabled = resourcePending || army.purchaseChoiceMade || !connected || !army.canControl;
          resourceButton.addEventListener('click', () => request({ type: 'buyIntermissionUpgrade', army: selectedPanel, choice: 'resources' }, resourceKey));
          resources.append(resourceTitle, resourceDesc, resourceButton); content.append(resources);
          return;
        }
        sectionButtons.forEach(button => button.hidden = true);

        const fragment = document.createDocumentFragment();
        fragment.append(createCombatStatistics(army));
        if (state.status === 'Finished') {
          const finished = document.createElement('p'); finished.className = 'blocked'; finished.textContent = 'Partida finalizada. Las órdenes están bloqueadas.'; fragment.prepend(finished);
        }
        content.replaceChildren(fragment);
      }
      function render() { if (!state) return; renderSeats(); renderPanel(); }
      function connect() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
        result.textContent = 'Conectando…'; result.dataset.kind = '';
        socket = new WebSocket(`ws://${location.host}/ws`);
        socket.addEventListener('open', () => { stateRevision = -1; updateConnection(true); request({ type: 'hello', clientToken: token }); });
        socket.addEventListener('close', () => updateConnection(false));
        socket.addEventListener('error', () => { updateConnection(false); feedback('No se pudo conectar. Comprueba la Wi-Fi y vuelve a intentarlo.', false); });
        socket.addEventListener('message', event => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'shopState') {
              if (message.revision < stateRevision) return;
              stateRevision = message.revision; state = message;
              if (sessionReady && !selectedPanel) selectedPanel = message.developerMode ? 'tierra' : message.selectedArmy;
              developerMode = message.developerMode; render();
            } else if (message.type === 'sessionResult') {
              sessionReady = message.success;
              if (message.message) { result.textContent = message.message; result.dataset.kind = message.success ? 'success' : 'error'; }
              render();
            } else {
              const actionKey = pendingRequests.get(message.requestId);
              if (actionKey) { pendingRequests.delete(message.requestId); pendingActions.delete(actionKey); }
              feedback(message.message, !!message.success);
              renderPanel();
            }
          } catch (_) { feedback('Unity envió una respuesta no válida.', false); }
        });
      }
      chooseButtons.forEach(button => button.addEventListener('click', () => request({ type: 'selectArmy', army: button.dataset.army })));
      developerButton.addEventListener('click', () => request({ type: 'joinDeveloper' }));
      tabs.forEach(tab => tab.addEventListener('click', () => { if (developerMode) { selectedPanel = tab.dataset.tab; renderPanel(); } }));
      sectionButtons.forEach(button => button.addEventListener('click', () => { activeSection = button.dataset.section; renderPanel(); }));
      document.getElementById('reconnect').addEventListener('click', connect);
      document.getElementById('reconnectLobby').addEventListener('click', connect);
      connect();
    })();
  </script>
</body>
</html>
